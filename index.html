<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Zenda.ia. Sistema de gestión de seguridad y salud en el trabajo." />
    <meta name="theme-color" content="#2B1A0F" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <script>
      try {
        var t = localStorage.getItem('crc-tema')
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light')
        else if (t === 'oscuro') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
    <title>Zenda.ia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
